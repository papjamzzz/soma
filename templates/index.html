<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>soma</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #08090d;
      --surface: #0d0f1a;
      --card:    #11131e;
      --border:  #1e2235;
      --text:    #f0f2ff;
      --dim:     #5a6080;
      --accent:  #4fc3f7;
      --good:    #34e5a4;
      --warn:    #ffb454;
      --bad:     #ff5d6c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
    }

    /* ── STAGE (3D canvas lives here) ── */
    #stage {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 30%, #14182a 0%, #0a0c14 45%, #050608 100%);
    }
    #stage canvas { display: block; opacity: 0; transition: opacity 1.2s ease; }

    /* soft vignette over everything */
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(70% 70% at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%);
    }

    /* ── HEADER ── */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      padding: 18px 26px;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .brand { display: flex; align-items: center; gap: 11px; pointer-events: auto; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(140deg, var(--accent), #6f7bff);
      box-shadow: 0 0 22px rgba(79,195,247,0.45);
      display: grid; place-items: center;
      font-weight: 900; font-size: 16px; color: #06080f;
    }
    .brand-name {
      font-size: 18px; font-weight: 800; letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 10px; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--dim); margin-top: 1px;
    }
    .header-right {
      pointer-events: auto;
      font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--dim);
      display: flex; align-items: center; gap: 8px;
    }
    .score { display: flex; flex-direction: column; align-items: flex-end; margin-right: 6px; }
    .score-num {
      font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
      color: var(--text); line-height: 1;
    }
    .score-lbl {
      font-size: 9px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--dim); margin-top: 3px;
    }
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--good); box-shadow: 0 0 10px var(--good);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    /* ── HINT ── */
    .hint {
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
      z-index: 30;
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--dim);
      display: flex; align-items: center; gap: 10px;
      background: rgba(13,15,26,0.5); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 100px;
      padding: 9px 18px;
      transition: opacity .6s;
    }
    .hint svg { width: 15px; height: 15px; opacity: 0.7; }

    /* ── LOADING ── */
    #loader {
      position: fixed; inset: 0; z-index: 50;
      display: grid; place-items: center;
      background: var(--bg);
      transition: opacity .8s ease;
    }
    #loader.hide { opacity: 0; pointer-events: none; }

    /* ── DETAIL PANEL ── */
    .panel {
      position: fixed; top: 0; right: 0; height: 100%; width: 358px;
      z-index: 40;
      background: linear-gradient(180deg, rgba(17,19,30,0.97), rgba(9,11,19,0.97));
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border);
      box-shadow: -34px 0 70px rgba(0,0,0,0.55);
      transform: translateX(100%);
      transition: transform .46s cubic-bezier(.16,1,.3,1);
      display: flex; flex-direction: column;
      padding: 26px 22px 22px;
    }
    .panel.open { transform: translateX(0); }
    .panel-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .panel-region {
      font-size: 10px; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--dim);
    }
    .panel-title {
      font-size: 25px; font-weight: 800; letter-spacing: -0.02em; margin-top: 5px;
    }
    .panel-close {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--dim); width: 30px; height: 30px; border-radius: 8px;
      cursor: pointer; font-size: 13px; transition: all .2s; flex: none;
    }
    .panel-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .panel-pill {
      display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
      margin-top: 16px; padding: 6px 12px; border-radius: 100px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .pill-dot { width: 8px; height: 8px; border-radius: 50%; }
    .panel-desc {
      font-size: 12.5px; color: var(--dim); line-height: 1.55; margin: 16px 0 10px;
    }
    .markers { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; margin-top: 6px; }
    .mrow {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 13px; border-radius: 11px;
      background: rgba(255,255,255,0.018); border: 1px solid transparent;
      transition: border-color .2s;
    }
    .mrow:hover { border-color: var(--border); }
    .mdot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
    .mlabel { font-size: 13px; font-weight: 600; flex: 1; }
    .mval { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
    .munit { font-size: 10px; color: var(--dim); margin-left: 3px; font-weight: 600; }
    .mtrend { width: 13px; text-align: center; font-size: 10px; color: var(--dim); flex: none; }
    .panel-empty {
      margin-top: 18px; padding: 22px; border-radius: 12px;
      background: rgba(255,255,255,0.02); border: 1px dashed var(--border);
      text-align: center; font-size: 11px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
    }

    /* ── HUD (score ring + legend + feed) ── */
    .hud {
      position: fixed; left: 22px; bottom: 22px; z-index: 30; width: 178px;
      display: flex; flex-direction: column; gap: 11px;
      background: rgba(13,15,26,0.55); backdrop-filter: blur(14px);
      border: 1px solid var(--border); border-radius: 16px; padding: 18px 18px 15px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.4);
    }
    .hud-score { position: relative; width: 120px; height: 120px; margin: 2px auto 0; }
    .ring { width: 120px; height: 120px; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 8; }
    .ring-fg {
      fill: none; stroke: var(--good); stroke-width: 8; stroke-linecap: round;
      stroke-dasharray: 326.7; stroke-dashoffset: 326.7;
      transition: stroke .5s; filter: drop-shadow(0 0 6px currentColor);
    }
    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .ring-num { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    .ring-lbl {
      font-size: 8.5px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--dim); margin-top: 5px;
    }
    .hud-div { height: 1px; background: var(--border); }
    .hud-feed {
      display: flex; align-items: center; gap: 8px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--dim);
    }
    .legend-item {
      display: flex; align-items: center; gap: 9px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--dim);
    }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .loader-inner { text-align: center; }
    .loader-ring {
      width: 46px; height: 46px; margin: 0 auto 18px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--dim);
    }
  </style>
</head>
<body>

<div id="stage"></div>
<div id="vignette"></div>

<header class="header">
  <div class="brand">
    <div class="brand-mark">S</div>
    <div>
      <div class="brand-name">soma</div>
      <div class="brand-sub">Live Biomarker Body</div>
    </div>
  </div>
  <div class="header-right">
    <span>Apple Watch</span>
    <span style="opacity:.4">·</span>
    <span>12 Signals</span>
  </div>
</header>

<div class="hint" id="hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
  </svg>
  Drag to rotate &nbsp;·&nbsp; Scroll to zoom
</div>

<aside class="panel" id="panel">
  <div class="panel-top">
    <div>
      <div class="panel-region">Region</div>
      <div class="panel-title" id="p-title">—</div>
    </div>
    <button class="panel-close" id="p-close">✕</button>
  </div>
  <div class="panel-pill" id="p-pill"><span class="pill-dot"></span><span id="p-pill-txt">—</span></div>
  <div class="panel-desc" id="p-desc"></div>
  <div class="markers" id="p-markers"></div>
</aside>

<div class="hud">
  <div class="hud-score">
    <svg class="ring" viewBox="0 0 120 120">
      <circle class="ring-bg" cx="60" cy="60" r="52"/>
      <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52"/>
    </svg>
    <div class="ring-center">
      <div class="ring-num" id="score-val">--</div>
      <div class="ring-lbl">Body Score</div>
    </div>
  </div>
  <div class="hud-div"></div>
  <div class="legend-item"><span class="legend-dot" style="color:var(--good);background:var(--good)"></span>Optimal</div>
  <div class="legend-item"><span class="legend-dot" style="color:var(--warn);background:var(--warn)"></span>Caution</div>
  <div class="legend-item"><span class="legend-dot" style="color:var(--bad);background:var(--bad)"></span>Critical</div>
  <div class="hud-div"></div>
  <div class="hud-feed"><span class="pulse-dot"></span> Simulated Feed</div>
</div>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-ring"></div>
    <div class="loader-text">Initializing Body</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const stage = document.getElementById('stage');

// ── Renderer ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

// ── Scene + Camera ────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0.25, 3.4);

// ── Environment (soft studio reflections) ─────────────────
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ── Lights ────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0x5a6a90, 0x0a0c14, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(2.5, 4, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x6f7bff, 1.4);
rim.position.set(-3, 2, -2.5); scene.add(rim);
const fill = new THREE.DirectionalLight(0x4fc3f7, 0.5);
fill.position.set(-2, -1, 2); scene.add(fill);

// ── Body material factory ─────────────────────────────────
// Each part gets its OWN material instance so regions can be
// colored independently in Phase 2.
const BASE_COLOR = new THREE.Color(0x5b6175);
function bodyMaterial() {
  return new THREE.MeshStandardMaterial({
    color: BASE_COLOR.clone(),
    roughness: 0.5,
    metalness: 0.18,
    emissive: new THREE.Color(0x000000),
    emissiveIntensity: 1.0,
  });
}

// ── Body group ────────────────────────────────────────────
const body = new THREE.Group();
scene.add(body);
const parts = {};   // name -> mesh (for Phase 2 region glow)

function register(name, mesh, region) {
  mesh.userData.region = region;
  mesh.userData.baseColor = mesh.material.color.clone();
  parts[name] = mesh;
  body.add(mesh);
  return mesh;
}

// Capsule spanning two points (organic rounded joints)
function limb(name, a, b, radius, region) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(B, A);
  const len = dir.length();
  const geo = new THREE.CapsuleGeometry(radius, len, 8, 20);
  const mesh = new THREE.Mesh(geo, bodyMaterial());
  mesh.position.copy(A).add(B).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0), dir.clone().normalize()
  );
  return register(name, mesh, region);
}

function blob(name, radius, pos, scale, region) {
  const geo = new THREE.SphereGeometry(radius, 32, 32);
  const mesh = new THREE.Mesh(geo, bodyMaterial());
  mesh.position.set(...pos);
  if (scale) mesh.scale.set(...scale);
  return register(name, mesh, region);
}

// ── Build the figure (androgynous, neutral proportions) ───
// Head + neck
blob('head', 0.135, [0, 0.78, 0], [0.9, 1.05, 0.95], 'brain');
limb('neck', [0,0.66,0], [0,0.58,0], 0.052, 'brain');

// Torso — three stacked, flattened front-to-back
const chest   = blob('chest',   0.175, [0, 0.45, 0], [1.05, 1.0, 0.62], 'cardio');
const abdomen = blob('abdomen', 0.15,  [0, 0.24, 0], [1.0, 1.0, 0.6],   'gut');
const pelvis  = blob('pelvis',  0.155, [0, 0.04, 0], [1.0, 0.85, 0.62], 'pelvis');

// Arms (slight outward A-pose)
limb('upperArmL', [-0.19,0.55,0], [-0.27,0.30,0.02], 0.05, 'arms');
limb('upperArmR', [ 0.19,0.55,0], [ 0.27,0.30,0.02], 0.05, 'arms');
limb('forearmL',  [-0.27,0.30,0.02], [-0.31,0.05,0.05], 0.043, 'arms');
limb('forearmR',  [ 0.27,0.30,0.02], [ 0.31,0.05,0.05], 0.043, 'arms');
blob('handL', 0.055, [-0.32,-0.02,0.06], [0.9,1.1,0.6], 'extremities');
blob('handR', 0.055, [ 0.32,-0.02,0.06], [0.9,1.1,0.6], 'extremities');

// Legs
limb('thighL', [-0.09,-0.04,0], [-0.11,-0.42,0], 0.082, 'legs');
limb('thighR', [ 0.09,-0.04,0], [ 0.11,-0.42,0], 0.082, 'legs');
limb('shinL',  [-0.11,-0.42,0], [-0.12,-0.82,0], 0.06, 'legs');
limb('shinR',  [ 0.11,-0.42,0], [ 0.12,-0.82,0], 0.06, 'legs');
blob('footL', 0.06, [-0.12,-0.86,0.04], [0.8,0.6,1.5], 'extremities');
blob('footR', 0.06, [ 0.12,-0.86,0.04], [0.8,0.6,1.5], 'extremities');

// Lift so the figure centers nicely in frame
body.position.y = 0.05;

// ── Ground glow (contact pad) ─────────────────────────────
const padGeo = new THREE.CircleGeometry(1.1, 64);
const padMat = new THREE.MeshBasicMaterial({
  color: 0x4fc3f7, transparent: true, opacity: 0.06,
});
const pad = new THREE.Mesh(padGeo, padMat);
pad.rotation.x = -Math.PI/2;
pad.position.y = -0.86;
scene.add(pad);

// ── Ambient particle field (atmospheric depth) ────────────
const pCount = 170;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  const r = 1.7 + Math.random() * 1.9;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  pPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
  pPos[i*3+1] = (Math.random() * 2 - 1) * 1.4;
  pPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: 0x6f8bd0, size: 0.013, transparent: true, opacity: 0.4, depthWrite: false,
}));
scene.add(particles);

// ── Post-processing (bloom for premium glow) ──────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.3,   // strength
  0.6,   // radius
  0.92   // threshold (only the hottest red regions bloom)
);
composer.addPass(bloom);

// ── Controls ──────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 5.5;
controls.target.set(0, 0.12, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minPolarAngle = Math.PI * 0.15;
controls.maxPolarAngle = Math.PI * 0.85;

// stop auto-rotate once the user grabs it
let userInteracted = false;
controls.addEventListener('start', () => {
  userInteracted = true;
  controls.autoRotate = false;
  const h = document.getElementById('hint');
  if (h) h.style.opacity = '0';
});

// ── Resize ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ── Phase 2: region heat system ───────────────────────────
// Group every mesh by its anatomical region so a whole zone
// glows together. Severity 0 = optimal (calm green), 0.5 =
// warning (amber), 1 = critical (hot red + pulse).
const regionMap = {};
Object.values(parts).forEach(m => {
  const r = m.userData.region;
  (regionMap[r] ||= []).push(m);
});

const C_GOOD = new THREE.Color(0x34e5a4);
const C_WARN = new THREE.Color(0xffb454);
const C_BAD  = new THREE.Color(0xff5d6c);
function severityColor(s) {
  const c = new THREE.Color();
  if (s < 0.5) c.lerpColors(C_GOOD, C_WARN, s / 0.5);
  else         c.lerpColors(C_WARN, C_BAD, (s - 0.5) / 0.5);
  return c;
}

const regionState = {};               // region -> { cur, target }
function setRegionSeverity(region, s) {
  s = Math.max(0, Math.min(1, s));
  if (!regionState[region]) regionState[region] = { cur: s, target: s };
  else regionState[region].target = s;
}

function updateRegions(t, dt) {
  for (const [region, meshes] of Object.entries(regionMap)) {
    const st = regionState[region] || { cur: 0, target: 0 };
    // ease current severity toward the live target
    st.cur += (st.target - st.cur) * Math.min(1, dt * 2.5);
    const s = st.cur;
    const col = severityColor(s);
    // healthy = calm/dim; problems glow and pulse — kept low so HUE reads
    const pulse = s > 0.4 ? (1 + Math.sin(t * 3.0) * 0.22 * s) : 1;
    let inten = (0.05 + s * 0.5) * pulse;
    let tint  = 0.45 + s * 0.35;      // color shows mostly on the lit surface
    if (region === selectedRegion) {  // brighten the inspected zone
      inten += 0.2 + Math.sin(t * 4.5) * 0.09;
      tint = Math.min(1, tint + 0.18);
    }
    meshes.forEach(m => {
      m.material.emissive.copy(col);
      m.material.emissiveIntensity = inten;
      m.material.color.copy(m.userData.baseColor).lerp(col, tint);
    });
  }
}

// ── Phase 4: interaction + detail panel ───────────────────
const REGION_INFO = {
  cardio:      { name: 'Cardiovascular', desc: 'Heart rate, HRV, recovery, rhythm and breathing — the core of your Watch signal.' },
  brain:       { name: 'Brain & Sleep',  desc: 'Sleep quality and HRV-based recovery reflect nervous-system load.' },
  legs:        { name: 'Legs & Output',  desc: 'Aerobic fitness, walking heart rate and daily movement.' },
  extremities: { name: 'Extremities',    desc: 'Blood-oxygen saturation, read at the periphery.' },
  gut:         { name: 'Core & Temp',    desc: 'Wrist-temperature deviation — an early illness / inflammation proxy.' },
  pelvis:      { name: 'Pelvis',         desc: null },
  arms:        { name: 'Arms',           desc: null },
};
const STATUS_COLOR = { good: 'var(--good)', warn: 'var(--warn)', critical: 'var(--bad)' };
const STATUS_WORD  = { good: 'Optimal', warn: 'Caution', critical: 'Critical' };

let latest = null;                 // last full snapshot
let selectedRegion = null;
const prevValues = {};             // key -> last value (for trend arrows)

function renderPanel() {
  const panel = document.getElementById('panel');
  if (!selectedRegion) { panel.classList.remove('open'); return; }
  const info = REGION_INFO[selectedRegion] || { name: selectedRegion, desc: null };
  document.getElementById('p-title').textContent = info.name;

  const ms = (latest ? latest.markers : []).filter(m => m.regions.includes(selectedRegion));
  const pill = document.getElementById('p-pill');
  const desc = document.getElementById('p-desc');
  const cont = document.getElementById('p-markers');

  if (ms.length === 0) {
    pill.style.display = 'none';
    desc.textContent = 'No Apple Watch signal maps to this region. It lights up from the Lab layer — blood-panel markers like cortisol & inflammation — coming soon.';
    cont.innerHTML = '<div class="panel-empty">Lab Layer Pending</div>';
    return;
  }
  pill.style.display = 'inline-flex';
  const order = { good: 0, warn: 1, critical: 2 };
  const worst = ms.reduce((a, m) => order[m.status] > order[a] ? m.status : a, 'good');
  pill.querySelector('.pill-dot').style.background = STATUS_COLOR[worst];
  pill.style.color = STATUS_COLOR[worst];
  document.getElementById('p-pill-txt').textContent = STATUS_WORD[worst];
  desc.textContent = info.desc || '';

  cont.innerHTML = ms.map(m => {
    const tr  = m._trend === 'up' ? '▲' : m._trend === 'down' ? '▼' : '·';
    const val = m.unit ? `${m.value}<span class="munit">${m.unit}</span>` : m.value;
    return `<div class="mrow">
        <span class="mdot" style="color:${STATUS_COLOR[m.status]};background:${STATUS_COLOR[m.status]}"></span>
        <span class="mlabel">${m.label}</span>
        <span class="mval">${val}</span>
        <span class="mtrend">${tr}</span>
      </div>`;
  }).join('');
}

function selectRegion(r) {
  selectedRegion = r;
  document.getElementById('panel').classList.add('open');
  renderPanel();
}
function closePanel() {
  selectedRegion = null;
  document.getElementById('panel').classList.remove('open');
}
document.getElementById('p-close').addEventListener('click', closePanel);

// Raycast click-to-select (ignores drags)
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downPt = null;
renderer.domElement.addEventListener('pointerdown', e => {
  downPt = { x: e.clientX, y: e.clientY, t: performance.now() };
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPt) return;
  const moved = Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y);
  const dt = performance.now() - downPt.t;
  downPt = null;
  if (moved > 6 || dt > 450) return;            // it was a rotate-drag
  ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(Object.values(parts), false);
  if (hits.length) selectRegion(hits[0].object.userData.region);
  else closePanel();
});

// ── Live biomarker feed ───────────────────────────────────
async function pollFeed() {
  try {
    const r = await fetch('/api/biomarkers', { cache: 'no-store' });
    const data = await r.json();
    data.markers.forEach(m => {
      const p = prevValues[m.key];
      if (typeof m.value === 'number' && typeof p === 'number') {
        m._trend = m.value > p + 0.05 ? 'up' : m.value < p - 0.05 ? 'down' : 'flat';
      } else m._trend = 'flat';
      prevValues[m.key] = m.value;
    });
    latest = data;
    for (const [region, sev] of Object.entries(data.regions)) setRegionSeverity(region, sev);
    window.SOMA && (window.SOMA.latest = data);
    renderPanel();   // live-refresh the open panel
  } catch (e) { /* keep last good state */ }
}
pollFeed();
setInterval(pollFeed, 2000);

// ── Body Score ring ───────────────────────────────────────
const RING_C = 326.7;                 // 2πr, r=52
const ringFg = document.getElementById('ring-fg');
const scoreEl = document.getElementById('score-val');
let scoreDisp = 0;                     // eases up from 0 on load
function updateScoreRing(v) {
  const pct = Math.max(0, Math.min(100, v)) / 100;
  ringFg.style.strokeDashoffset = RING_C * (1 - pct);
  const col = v >= 80 ? 'var(--good)' : v >= 60 ? 'var(--warn)' : 'var(--bad)';
  ringFg.style.stroke = col; ringFg.style.color = col;
  scoreEl.textContent = Math.round(v);
  scoreEl.style.color = col;
}

// ── Animate ───────────────────────────────────────────────
const clock = new THREE.Clock();
let prev = clock.getElapsedTime();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(0.1, t - prev); prev = t;
  // subtle breathing on the chest + gentle whole-body float
  const breathe = 1 + Math.sin(t * 1.1) * 0.012;
  chest.scale.set(1.05 * breathe, 1.0 * breathe, 0.62);
  body.position.y = 0.05 + Math.sin(t * 0.6) * 0.015;
  particles.rotation.y += dt * 0.02;
  updateRegions(t, dt);
  // ease the score ring toward the live overall
  if (latest) { scoreDisp += (latest.overall - scoreDisp) * Math.min(1, dt * 2.2); updateScoreRing(scoreDisp); }
  controls.update();
  composer.render();
}
animate();

// reveal — fade the canvas in and drop the loader
setTimeout(() => {
  renderer.domElement.style.opacity = '1';
  const l = document.getElementById('loader');
  if (l) l.classList.add('hide');
}, 350);

// expose for Phase 2 wiring / debugging
window.SOMA = { scene, parts, body, camera, controls, bloom, setRegionSeverity, regionMap };
</script>
